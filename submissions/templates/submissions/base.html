{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}EcoCash{% endblock %}</title>

  <!-- SEO -->
  <meta name="description" content="{% block meta_description %}EcoCash — fast, secure mobile money.{% endblock %}" />
  <meta name="robots"      content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="EcoCash" />
  <meta property="og:title"       content="{% block og_title %}EcoCash{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}Fast, secure mobile money.{% endblock %}" />
  <meta property="og:url"         content="{{ request.build_absolute_uri }}" />
  <meta property="og:image"       content="{{ request.scheme }}://{{ request.get_host }}{% static 'submissions/img/og-cover.png' %}" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{% block twitter_title %}EcoCash{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}Fast, secure mobile money.{% endblock %}" />
  <meta name="twitter:image"       content="{{ request.scheme }}://{{ request.get_host }}{% static 'submissions/img/og-cover.png' %}" />

  <!-- Favicons -->
  <link rel="icon"             type="image/png" sizes="32x32" href="{% static 'submissions/img/favicon-32.png' %}" />
  <link rel="icon"             type="image/png" sizes="16x16" href="{% static 'submissions/img/favicon-16.png' %}" />
  <link rel="apple-touch-icon" sizes="180x180"  href="{% static 'submissions/img/apple-touch-icon.png' %}" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --eco-blue:      #0057a8;
      --eco-blue-dark: #004080;
      --eco-red:       #e02020;
      --eco-text:      #1a1a1a;
      --eco-muted:     #555;
      --eco-border:    #c8d8ea;
      --eco-success:   #1a9c5b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: #f5f8fb;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
    }

    .top-section {
      flex: 1;
      padding: 48px 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .logo span:first-child { color: var(--eco-blue); }
    .logo span:last-child  { color: var(--eco-red);  }

    /* card used by success / other pages that extend base */
    .card {
      width: 100%;
      padding: 0 0 32px;
    }
    .card__eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--eco-blue);
      margin-bottom: 8px;
    }
    .card__title {
      font-size: 26px;
      font-weight: 700;
      color: var(--eco-text);
      margin-bottom: 8px;
    }
    .card__subtitle {
      font-size: 15px;
      color: var(--eco-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* Shared button */
    .btn--primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--eco-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }
    .btn--primary:hover { background: var(--eco-blue-dark); }

    /* colour helpers used by success */
    --color-border:  var(--eco-border);
    --color-text:    var(--eco-text);
    --color-muted:   var(--eco-muted);

    .wave {
      display: block;
      width: 100%;
      margin-bottom: -2px;
    }

    .bottom-section {
      background: var(--eco-blue);
      padding: 20px 28px 32px;
      text-align: center;
    }
    .terms {
      font-size: 11px;
      color: rgba(255,255,255,.6);
    }
    .terms a { color: rgba(255,255,255,.8); text-decoration: underline; }

    @media (min-width: 481px) {
      .page { box-shadow: 0 4px 32px rgba(0,0,0,.1); }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="page">

  <div class="top-section">
    <a href="{% url 'submissions:login' %}" class="logo">
      <span>Eco</span><span>Cash</span>
    </a>

    {% block content %}{% endblock %}
  </div>

  <svg class="wave" viewBox="0 0 480 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 C120,60 360,60 480,0 L480,60 L0,60 Z" fill="#0057a8"/>
  </svg>

  <div class="bottom-section">
    <p class="terms">
      &copy; 2026 EcoCash &nbsp;·&nbsp;
      <a href="#">Privacy</a> &nbsp;·&nbsp; <a href="#">Terms</a>
    </p>
  </div>

</div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
